[Sleep]
# The installer adds a swapfile and resume config where the fs supports it; live ISO and raw VM images
# carry no swap. This is a dpkg conffile: runtime overrides belong in a separate drop-in (60-vos-user.conf).
AllowSuspend=yes
AllowHibernation=yes
AllowSuspendThenHibernate=no
AllowHybridSleep=no
