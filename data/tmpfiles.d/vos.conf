# /run/vos: janus writes first-boot.conf here (0400) before forking
# vos-firstboot-commit.
d /run/vos 0700 root root -
# /run/polkit-1/rules.d: the remembered-admin grant rule; polkitd watches it
# only when it exists at start.
d /run/polkit-1 0755 root root -
d /run/polkit-1/rules.d 0755 root root -
