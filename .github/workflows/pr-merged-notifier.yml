name: Notify Chat on PR merge

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: read

jobs:
  notify-telegram:
    # `closed` fires for abandoned PRs too; only merged ones are news.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Build Telegram message
        id: build
        env:
          NUMBER:   ${{ github.event.pull_request.number }}
          TITLE:    ${{ github.event.pull_request.title }}
          USER:     ${{ github.event.pull_request.user.login }}
          URL:      ${{ github.event.pull_request.html_url }}
          BASE:     ${{ github.event.pull_request.base.ref }}
          HEAD:     ${{ github.event.pull_request.head.ref }}
          MERGER:   ${{ github.event.pull_request.merged_by.login }}
          COMMITS:  ${{ github.event.pull_request.commits }}
          ADD:      ${{ github.event.pull_request.additions }}
          DEL:      ${{ github.event.pull_request.deletions }}
          FILES:    ${{ github.event.pull_request.changed_files }}
          REPO:     ${{ github.repository }}
        run: |
          set -euo pipefail

          esc() { printf '%s' "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }

          repo_url="https://github.com/${REPO}"
          repo_link="<a href=\"${repo_url}\">$(esc "$REPO")</a>"
          pr_link="<a href=\"$(esc "$URL")\">$(esc "#${NUMBER}: ${TITLE}")</a>"

          header="<b>Pull request merged</b>"
          meta="Repo: ${repo_link}"$'\n'"PR: ${pr_link}"$'\n'"Author: $(esc "$USER")"$'\n'"Merged by: $(esc "$MERGER")"$'\n'"Branch: $(esc "${HEAD} -> ${BASE}")"
          stat="${COMMITS} commit(s), ${FILES} file(s), +${ADD}/-${DEL}"

          final="${header}"$'\n'"${meta}"$'\n\n'"$(esc "$stat")"

          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "msg<<${delim}"
            printf '%s\n' "$final"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # Development topic: t.me/vitruvian_official_chat/2242
          TELEGRAM_TOPIC:     "2242"
          MSG:                ${{ steps.build.outputs.msg }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID — skipping."
            exit 0
          fi
          curl -sS --fail -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "message_thread_id=${TELEGRAM_TOPIC}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${MSG}"
