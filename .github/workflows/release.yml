# Attach a published release's images, taken from the Factory rev that
# built the tagged commit.
#
# Releases are tagged here, in this repository: a version tag is part of
# the source history and belongs with it. Factory holds the rev archive,
# one release per build, which is the churn that should not accumulate
# here. So the images come FROM Factory and are attached to the release
# rather than rebuilt, which would produce different bytes.

name: Attach release images from Factory

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  FACTORY_REPO: VitruvianOS/VitruvianFactory

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Find the Factory rev built from this commit
        id: rev
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          # Each Factory release records the commit it was built from, so
          # this is a lookup rather than a guess at build order.
          tag=$(gh api "repos/$FACTORY_REPO/releases?per_page=100" --paginate \
                  --jq --arg sha "$sha" \
                  'map(select(.body | contains($sha))) | .[0].tag_name // empty')
          if [ -z "$tag" ]; then
            echo "No Factory release records a build from $sha." >&2
            echo "Tag a commit that has been built, or run Factory release" \
                 "on it first." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$sha was built as $tag"

      - name: Download that rev's images
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          REV: ${{ steps.rev.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$REV" --repo "$FACTORY_REPO" --dir assets
          ls -lh assets

      # Names are left exactly as Factory published them. They already
      # carry the version, arch, board, rev and sha, and each .sha256
      # names its file in its contents, so renaming would invalidate the
      # checksums as well as break the link back to the rev.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REV: ${{ steps.rev.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" assets/* --clobber
          url="https://github.com/$FACTORY_REPO/releases/tag/$REV"
          notes=$(gh release view "$TAG" --json body --jq '.body')
          printf '%s\n\n---\n\nBuilt as [%s](%s).\n' "$notes" "$REV" "$url" \
            > notes.md
          gh release edit "$TAG" --notes-file notes.md
