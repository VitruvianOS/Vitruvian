<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store</title>
<style>/*store-css*/</style>
</head>
<body>
<div id="app">
	<nav id="sidebar">
		<h1>Store</h1>
		<ul id="sections"></ul>
		<ul id="categories"></ul>
	</nav>
	<main id="content">
		<header id="header"><input id="search" type="search" placeholder="Search" autocomplete="off"></header>
		<div id="status"></div>
		<ul id="entries"></ul>
		<button id="more" class="hidden">Show more</button>
		<div id="detail" class="hidden">
			<button id="detail-back">&larr; Back</button>
			<div id="detail-previews" class="previews hidden"></div>
			<img id="detail-icon" class="icon hidden" alt="">
			<div id="detail-letter" class="letter"></div>
			<h2 id="detail-name"></h2>
			<p id="detail-summary"></p>
			<p id="detail-meta"></p>
			<p id="detail-requires" class="requires hidden"></p>
			<button id="detail-action"></button>
			<div id="progress" class="hidden">
				<div id="progress-bar"></div>
				<span id="progress-text"></span>
			</div>
		</div>
	</main>
</div>
<script>/*store-js*/</script>
</body>
</html>
