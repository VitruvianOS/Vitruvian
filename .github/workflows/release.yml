# Link a published release to the Factory rev that built it.
#
# Images are not copied here. VitruvianFactory holds one release per build
# and is public, so a release points at the rev its tag was built from
# instead of keeping a second copy of every image in this repository.

name: Link release to its Factory rev

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  FACTORY_REPO: VitruvianOS/VitruvianFactory

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Find the Factory rev built from this commit
        id: rev
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          # Each Factory release records the commit it was built from, so
          # the mapping is a lookup rather than a guess at build order.
          tag=$(gh api "repos/$FACTORY_REPO/releases?per_page=100" --paginate \
                  --jq --arg sha "$sha" \
                  'map(select(.body | contains($sha))) | .[0].tag_name // empty')
          if [ -z "$tag" ]; then
            echo "No Factory release records a build from $sha." >&2
            echo "Publishing a release for a commit that was never built" \
                 "would leave the release pointing at nothing." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$sha was built as $tag"

      - name: Append the download links to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REV: ${{ steps.rev.outputs.tag }}
        run: |
          set -euo pipefail
          url="https://github.com/$FACTORY_REPO/releases/tag/$REV"
          notes=$(gh release view "$TAG" --json body --jq '.body')
          printf '%s\n\n---\n\nImages for this release: [%s](%s)\n' \
            "$notes" "$REV" "$url" > notes.md
          gh release edit "$TAG" --notes-file notes.md
