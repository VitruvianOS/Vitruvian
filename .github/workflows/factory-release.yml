#  Allocate a build number in VitruvianFactory, build, and archive there.
#
# The counter lives in VitruvianFactory, not here, so this repository's
# history stays free of one tag per push. A rev is a release in Factory
# whose body records the Vitruvian sha it was built from.
#
# Prerequisites, both outside this file:
#   - VitruvianFactory has at least one commit, so a release has something
#     to tag. An empty repository cannot hold one.
#   - FACTORY_TOKEN: contents:write on VitruvianFactory. GITHUB_TOKEN is
#     scoped to the repository running the workflow and cannot write to
#     another one, so a PAT is the only option.

name: Factory release

on:
  push:
    branches: [master]
  workflow_dispatch:

# A newer push supersedes this run. Cancelling is safe for the counter:
# allocation reads the highest rev already PUBLISHED, so a cancelled
# run's number is simply taken by the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FACTORY_REPO: VitruvianOS/VitruvianFactory

jobs:
  allocate:
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.next.outputs.rev }}
    steps:
      # Without this the failure surfaces as an opaque gh 404 three steps
      # later, after a full build has already run.
      - name: Check the Factory credentials are configured
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || {
            echo "FACTORY_TOKEN is not set. It needs contents:write on $FACTORY_REPO." >&2
            exit 1
          }
          gh api "repos/$FACTORY_REPO" --jq '.full_name' >/dev/null || {
            echo "Cannot read $FACTORY_REPO with FACTORY_TOKEN; check the token's scope covers it." >&2
            exit 1
          }

      - name: Allocate the next rev from Factory
        id: next
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$FACTORY_REPO/releases?per_page=100" \
                     --jq '[.[] | .tag_name | select(test("^rev-[0-9]+$")) | ltrimstr("rev-") | tonumber] | max // 0')
          echo "rev=$((latest + 1))" >> "$GITHUB_OUTPUT"
          echo "latest in Factory: $latest, allocating $((latest + 1))"

  build:
    needs: allocate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            build_dir: generated.x86
            extra_pkgs: grub-efi-amd64-bin grub-pc-bin ovmf
          - arch: arm64
            runner: ubuntu-24.04-arm
            build_dir: generated.arm64
            extra_pkgs: grub-efi-arm64-bin qemu-efi-aarch64
    env:
      VOS_PKG_REV: ${{ needs.allocate.outputs.rev }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison build-essential cmake debootstrap debhelper \
            dh-dkms dkms elfutils flex git \
            libdrm-dev libelf-dev libfl-dev libfreetype6-dev \
            libgif-dev libicns-dev libicu-dev libinput-dev \
            libjpeg-dev libncurses-dev libopenexr-dev libpng-dev \
            libtiff-dev libudev-dev libwebp-dev libseat-dev \
            libpam0g-dev libsystemd-dev libevdev-dev \
            libblkid-dev libxkbcommon-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libbluetooth-dev libnm-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            linux-headers-$(uname -r) \
            mtools ninja-build squashfs-tools sudo xorriso zlib1g-dev \
            libapt-pkg-dev fakeroot devscripts lintian wget qemu-utils \
            rsync parted zstd dosfstools attr \
            ${{ matrix.extra_pkgs }}

      - name: Configure git safe.directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Build buildtools
        run: |
          mkdir -p buildtools
          cd buildtools
          cmake -DBUILDTOOLS_MODE=1 .. -GNinja
          ninja

      - name: Configure (also creates chroot)
        run: |
          mkdir -p ${{ matrix.build_dir }}
          cd ${{ matrix.build_dir }}
          ../configure --arch=${{ matrix.arch }} --build-type=Release \
                       --chroot-build --buildtools=../buildtools

      - name: Build ISO + RAW images
        run: cd ${{ matrix.build_dir }} && ../bake build --image-type=iso,raw

      - name: Compress RAW images
        run: |
          shopt -s nullglob
          cd ${{ matrix.build_dir }}/output
          for f in *.raw; do
            zstd -T0 --long=27 -19 --rm "$f"
          done

      # Published names carry everything a downloader needs to tell two
      # artifacts apart. The build tree only knows the board, so the arch,
      # the rev and the sha are added here.
      - name: Name the artifacts for publication
        id: stage
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short=9 HEAD)
          ver=$(sed -n 's/^project(VOS VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p staging
          shopt -s nullglob
          for f in ${{ matrix.build_dir }}/output/*.iso ${{ matrix.build_dir }}/output/*.raw.zst; do
            base=$(basename "$f")
            board=${base#vos-}
            board=${board%%.*}
            ext=${base#*.}
            out="vos-${ver}-${{ matrix.arch }}-${board}-rev${VOS_PKG_REV}-${sha}.${ext}"
            cp "$f" "staging/$out"
            ( cd staging && sha256sum "$out" > "$out.sha256" )
            echo "staged $out"
          done

      - name: Upload for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: factory-${{ matrix.arch }}
          path: staging/*
          if-no-files-found: error
          # Only a handoff to the publish job. Factory keeps the real copy.
          retention-days: 1

  publish:
    needs: [allocate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Collect both architectures
        uses: actions/download-artifact@v4
        with:
          pattern: factory-*
          merge-multiple: true
          path: assets

      # A release asset is capped at 2 GiB. Fail here rather than halfway
      # through an upload that leaves the release incomplete.
      - name: Reject oversized assets
        run: |
          set -euo pipefail
          over=$(find assets -type f -size +2147483647c -printf '%p %s\n')
          if [ -n "$over" ]; then
            echo "$over" >&2
            echo "asset exceeds the 2 GiB release limit" >&2
            exit 1
          fi
          ls -la assets

      - name: Publish rev to Factory
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          REV: ${{ needs.allocate.outputs.rev }}
        run: |
          set -euo pipefail
          gh release create "rev-$REV" \
            --repo "$FACTORY_REPO" \
            --title "rev-$REV" \
            --notes "Built from ${{ github.repository }}@${{ github.sha }}" \
            assets/*

      - name: Announce on Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          REV:                ${{ needs.allocate.outputs.rev }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram not configured, skipping."
            exit 0
          fi
          short=$(echo "${{ github.sha }}" | cut -c1-9)
          msg=$(printf '<b>rev-%s</b> published to VitruvianFactory\nfrom %s@%s\nhttps://github.com/%s/releases/tag/rev-%s' \
                  "$REV" "${{ github.repository }}" "$short" "$FACTORY_REPO" "$REV")
          curl -sS --fail -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${msg}"
