name: Native amd64 build test

on:
  push:
    branches:
      - '**'

jobs:
  native-build:
    name: Native amd64 build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison build-essential cmake debootstrap debhelper \
            dh-dkms dkms elfutils flex git \
            grub-efi-amd64-bin grub-pc-bin \
            libdrm-dev libelf-dev libfl-dev libfreetype6-dev \
            libgif-dev libicns-dev libicu-dev libinput-dev \
            libjpeg-dev libncurses-dev libopenexr-dev libpng-dev \
            libtiff-dev libudev-dev libwebp-dev libseat-dev \
            libpam0g-dev libsystemd-dev libevdev-dev \
            libblkid-dev libxkbcommon-dev libgl1-mesa-dev libgbm-dev \
            libglu1-mesa-dev \
             libpipewire-0.3-dev libspa-0.2-dev \
             libbluetooth-dev libnm-dev libglib2.0-dev \
             libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libegl-dev libgl-dev linux-headers-$(uname -r) \
            mtools ninja-build squashfs-tools sudo xorriso zlib1g-dev \
            libapt-pkg-dev fakeroot devscripts lintian wget attr \
            catch2

      - name: Configure git safe.directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Build buildtools
        run: |
          mkdir -p buildtools
          cd buildtools
          cmake -DBUILDTOOLS_MODE=1 .. -GNinja
          ninja

      - name: Create build directory
        run: mkdir -p generated.x86

      - name: Setup environment
        run: cd generated.x86 && ../build/scripts/setupenv.sh --arch=amd64

      - name: Configure
        run: cd generated.x86 && ../configure --arch=amd64 --build-type=Workflow --buildtools=../buildtools --tests

      - name: Build
        run: cd generated.x86 && ninja

      # The unit tests need the nexus kernel module, which is built by DKMS for
      # whatever kernel the runner has. If the module isn't compatible with the
      # kernel, warn and skip the tests.
      - name: Load the nexus kernel module
        id: nexus
        run: |
          cd generated.x86
          echo "Runner kernel: $(uname -r)"
          if sudo dpkg -i nexus-dkms_1_all.deb \
              && sudo modprobe nexus \
              && sudo modprobe nexus_node_monitor; then
            ls -l /dev/nexus*
            echo "loaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "----- DKMS make.log -----"
            sudo cat /var/lib/dkms/nexus/1/build/make.log \
              || echo "(make.log not found)"
            echo "-------------------------"
            echo "::warning title=Unit tests skipped::The nexus module could not be loaded on runner kernel $(uname -r), so the unit tests were built but not run. See the make.log above."
            echo "loaded=false" >> "$GITHUB_OUTPUT"
          fi

      # Run the unit tests that only need the kernel module.
      - name: Run unit tests
        if: steps.nexus.outputs.loaded == 'true'
        run: |
          cd generated.x86
          sudo ctest --output-on-failure --label-exclude needs-registrar \
            --timeout 300 --no-tests=error

      - name: Upload test log
        if: always() && steps.nexus.outputs.loaded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: generated.x86/Testing/Temporary/LastTest.log
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: |
            generated.x86/CMakeFiles/CMakeOutput.log
            generated.x86/src/servers/app/app_server
